spring.application.name=notification-dispatch-service

spring.datasource.url=jdbc:h2:mem:demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Reject new dispatches after this many consecutive delivery failures, until the cooldown passes
notification.circuit-breaker.failure-threshold=3
notification.circuit-breaker.cooldown=30s
